<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Desarrollador · confirmaciones.json</title>
    <style>
        :root {
            --bg: #181216;
            --card: #241b21;
            --border: #4a3542;
            --rose: #d86c8e;
            --gold: #d4af37;
            --text: #f7eef2;
            --muted: #b59da9;
            --success: #2ea043;
            --danger: #da3633;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 2rem 1rem;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.45);
        }
        h1 {
            margin: 0 0 0.4rem;
            font-size: 1.4rem;
            color: var(--gold);
        }
        p {
            margin: 0 0 1rem;
            font-size: 0.9rem;
            color: var(--muted);
        }
        .endpoint-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            padding: 0.75rem;
            background: rgba(0,0,0,0.25);
            border-radius: 10px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }
        .endpoint-bar a {
            color: var(--rose);
            word-break: break-all;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }
        button {
            padding: 0.6rem 1.1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #33262f;
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.86rem;
        }
        button:hover { filter: brightness(1.15); }
        button.primary {
            background: var(--success);
            border-color: transparent;
            color: #fff;
        }
        button.danger {
            background: var(--danger);
            border-color: transparent;
            color: #fff;
        }
        textarea {
            width: 100%;
            min-height: 420px;
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #120d10;
            color: #f8d9e4;
            font-family: Consolas, Monaco, "Courier New", monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            resize: vertical;
        }
        .status {
            margin-top: 0.8rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.88rem;
            background: rgba(255,255,255,0.06);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠️ Editor de Desarrollador · confirmaciones.json (Nube)</h1>
        <p>Edita directamente el archivo JSON en la nube que consultan todos los celulares y computadoras.</p>

        <div class="endpoint-bar">
            <strong>Enlace directo del JSON en la nube:</strong>
            <a href="https://textdb.dev/api/data/abigail-xv-confirmaciones-2027-cr" target="_blank" rel="noopener noreferrer">
                https://textdb.dev/api/data/abigail-xv-confirmaciones-2027-cr ↗
            </a>
        </div>

        <div class="toolbar">
            <button type="button" id="load-btn">🔄 Recargar desde la nube</button>
            <button type="button" class="primary" id="save-btn">💾 Guardar cambios en la nube</button>
            <button type="button" id="format-btn">✨ Formatear JSON</button>
            <button type="button" class="danger" id="clear-btn">🗑️ Vaciar lista ([])</button>
        </div>

        <textarea id="json-editor" spellcheck="false">Cargando...</textarea>
        <div class="status" id="status-msg">Listo.</div>
    </div>

    <script>
        const CLOUD_JSON_URL = "https://textdb.dev/api/data/abigail-xv-confirmaciones-2027-cr";
        const STORAGE_KEY = "abigail_xv_confirmaciones_json_v1";
        const editor = document.getElementById("json-editor");
        const statusMsg = document.getElementById("status-msg");

        function setStatus(text, isError = false) {
            statusMsg.textContent = text;
            statusMsg.style.color = isError ? "#ff7b72" : "#7ee787";
        }

        async function loadCloudJson() {
            setStatus("Cargando JSON desde la nube...");
            try {
                const resp = await fetch(`${CLOUD_JSON_URL}?t=${Date.now()}`, { cache: "no-store" });
                const text = (await resp.text()).trim() || "[]";
                const parsed = JSON.parse(text);
                editor.value = JSON.stringify(parsed, null, 2);
                setStatus(`JSON cargado correctamente (${Array.isArray(parsed) ? parsed.length : 0} registros).`);
            } catch (err) {
                setStatus("Error al cargar el JSON: " + err.message, true);
            }
        }

        async function saveCloudJson() {
            let parsed;
            try {
                parsed = JSON.parse(editor.value);
                if (!Array.isArray(parsed)) {
                    setStatus("El JSON debe ser un arreglo [ ... ].", true);
                    return;
                }
            } catch (err) {
                setStatus("Error de sintaxis en el JSON: " + err.message, true);
                return;
            }

            const formatted = JSON.stringify(parsed, null, 2);
            editor.value = formatted;
            setStatus("Guardando cambios en la nube...");

            try {
                const resp = await fetch(CLOUD_JSON_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: formatted
                });
                if (!resp.ok) throw new Error("HTTP " + resp.status);
                try {
                    localStorage.setItem(STORAGE_KEY, formatted);
                } catch {}
                setStatus(`¡Guardado en la nube con éxito! (${parsed.length} registros activos en todos los dispositivos).`);
            } catch (err) {
                setStatus("No se pudo guardar en la nube: " + err.message, true);
            }
        }

        document.getElementById("load-btn").addEventListener("click", loadCloudJson);
        document.getElementById("save-btn").addEventListener("click", saveCloudJson);
        document.getElementById("format-btn").addEventListener("click", () => {
            try {
                editor.value = JSON.stringify(JSON.parse(editor.value), null, 2);
                setStatus("JSON formateado correctamente.");
            } catch (err) {
                setStatus("JSON inválido: " + err.message, true);
            }
        });
        document.getElementById("clear-btn").addEventListener("click", async () => {
            if (!confirm("¿Seguro que deseas borrar todas las confirmaciones de prueba y dejar el JSON vacío []?")) return;
            editor.value = "[]";
            await saveCloudJson();
        });

        loadCloudJson();
    </script>
</body>
</html>
